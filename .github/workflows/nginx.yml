name: Nginx Static CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nginx-static-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ALPINE_VERSION: "3.24"
  CCACHE_MAXSIZE: 2G
  CCACHE_DIR: ${{ github.workspace }}/.ccache-static
  CCACHE_BASEDIR: ${{ github.workspace }}
  CCACHE_NOHASHDIR: "true"

jobs:
  build-static:
    name: Build static
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Restore ccache
        uses: actions/cache@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: nginx-static-${{ runner.arch }}-${{ hashFiles('build_static.sh', '.github/workflows/nginx.yml') }}
          restore-keys: |
            nginx-static-${{ runner.arch }}-

      - name: Build static nginx
        run: |
          set -eux

          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/work" \
            -w /work \
            -e CCACHE_DIR=/work/.ccache-static \
            -e CCACHE_MAXSIZE="${CCACHE_MAXSIZE}" \
            -e CCACHE_BASEDIR=/work \
            -e CCACHE_NOHASHDIR=true \
            alpine:${ALPINE_VERSION} \
            sh -euxc '
              apk add --no-cache bash ccache file binutils

              bash ./build_static.sh

              test -f nginx-static
              chmod 0755 nginx-static

              ccache --show-stats || true
            '

      - name: Verify binary
        run: |
          set -eux

          test -x nginx-static

          ./nginx-static -V
          file nginx-static

          ! readelf -l nginx-static | grep -q "Requesting program interpreter"
          ! readelf -d nginx-static | grep -q "(NEEDED)"

          sha256sum nginx-static > nginx-static.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: nginx-static
          path: |
            nginx-static
            nginx-static.sha256
            NGINX_VERSION
          if-no-files-found: error
          compression-level: 9
