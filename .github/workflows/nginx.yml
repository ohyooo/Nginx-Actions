name: Nginx Static CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build nginx
    runs-on: ubuntu-latest

    container:
      image: alpine:latest

    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 1G

    steps:
      # GitHub JavaScript Actions 在 Alpine/musl 容器中运行所需的基础环境。
      # build_static.sh 会自行安装完整编译依赖。
      - name: Prepare container
        run: |
          apk add --no-cache \
            bash \
            git \
            ca-certificates \
            gcompat \
            libstdc++ \
            tar \
            zstd

      - name: Checkout
        uses: actions/checkout@v7

      - name: Cache ccache
        uses: actions/cache@v6
        with:
          path: .ccache
          key: ccache-${{ runner.os }}-alpine-${{ hashFiles('NGINX_VERSION', 'build_static.sh') }}
          restore-keys: |
            ccache-${{ runner.os }}-alpine-

      - name: Build nginx
        run: |
          bash ./build_static.sh

      - name: Prepare artifact
        run: |
          set -eux

          test -x nginx-static

          mv nginx-static nginx
          chmod 0755 nginx

          ./nginx -V

          echo
          echo "=== file ==="
          file nginx

          echo
          echo "=== sha256 ==="
          sha256sum nginx

      - name: Upload nginx
        uses: actions/upload-artifact@v7
        with:
          name: nginx
          path: nginx
          if-no-files-found: error
          compression-level: 0
          archive: false
