name: Nginx Static CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  NGINX_VERSION: "1.31.5"

jobs:
  build:
    name: Build nginx
    runs-on: ubuntu-latest

    container:
      image: alpine:latest

    steps:
      - name: Install dependencies
        run: |
          set -eux

          apk add --no-cache \
            bash \
            build-base \
            cmake \
            ninja \
            git \
            wget \
            tar \
            perl \
            linux-headers \
            pcre2-dev \
            pcre2-static \
            zlib-dev \
            zlib-static

      - name: Build BoringSSL
        run: |
          set -eux

          git clone \
            --depth=1 \
            https://boringssl.googlesource.com/boringssl \
            /tmp/boringssl

          cmake \
            -S /tmp/boringssl \
            -B /tmp/boringssl/build \
            -GNinja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF

          cmake --build /tmp/boringssl/build --parallel

      - name: Download nginx
        run: |
          set -eux

          wget -O /tmp/nginx.tar.gz \
            "https://nginx.org/download/nginx-${NGINX_VERSION}.tar.gz"

          tar -C /tmp -xzf /tmp/nginx.tar.gz

      - name: Configure nginx
        working-directory: /tmp
        run: |
          set -eux

          cd "nginx-${NGINX_VERSION}"

          ./configure \
            --prefix=/etc/nginx \
            --sbin-path=/usr/sbin/nginx \
            --modules-path=/usr/lib/nginx/modules \
            --conf-path=/etc/nginx/nginx.conf \
            --error-log-path=/var/log/nginx/error.log \
            --http-log-path=/var/log/nginx/access.log \
            --pid-path=/run/nginx.pid \
            --lock-path=/run/nginx.lock \
            --http-client-body-temp-path=/var/cache/nginx/client_temp \
            --http-proxy-temp-path=/var/cache/nginx/proxy_temp \
            --http-fastcgi-temp-path=/var/cache/nginx/fastcgi_temp \
            --http-uwsgi-temp-path=/var/cache/nginx/uwsgi_temp \
            --http-scgi-temp-path=/var/cache/nginx/scgi_temp \
            \
            --with-cc-opt="-Os -I/tmp/boringssl/include" \
            --with-ld-opt="-static -L/tmp/boringssl/build/ssl -L/tmp/boringssl/build/crypto -lstdc++ -pthread" \
            \
            --with-threads \
            --with-file-aio \
            \
            --with-http_ssl_module \
            --with-http_v2_module \
            --with-http_v3_module \
            --with-http_realip_module \
            --with-http_addition_module \
            --with-http_sub_module \
            --with-http_dav_module \
            --with-http_flv_module \
            --with-http_mp4_module \
            --with-http_gunzip_module \
            --with-http_gzip_static_module \
            --with-http_auth_request_module \
            --with-http_random_index_module \
            --with-http_secure_link_module \
            --with-http_slice_module \
            --with-http_stub_status_module \
            --with-http_json_module \
            \
            --with-stream \
            --with-stream_ssl_module \
            --with-stream_ssl_preread_module \
            --with-stream_realip_module

      - name: Build nginx
        working-directory: /tmp
        run: |
          set -eux

          cd "nginx-${NGINX_VERSION}"

          make -j"$(nproc)"

          cp objs/nginx "$GITHUB_WORKSPACE/nginx"
          chmod +x "$GITHUB_WORKSPACE/nginx"

      - name: Verify binary
        run: |
          set -eux

          test -x nginx

          ./nginx -V

          echo
          echo "=== file ==="
          file nginx

          echo
          echo "=== dynamic dependencies ==="

          if ldd nginx 2>&1 | grep -Eq \
            'not a dynamic executable|statically linked'; then
            echo "OK: nginx is statically linked"
          else
            ldd nginx || true
            echo "ERROR: nginx is not fully static"
            exit 1
          fi

          echo
          echo "=== required modules ==="

          ./nginx -V 2>&1 | grep -q -- \
            '--with-http_json_module'

          ./nginx -V 2>&1 | grep -q -- \
            '--with-http_slice_module'

          ./nginx -V 2>&1 | grep -q -- \
            '--with-http_ssl_module'

          ./nginx -V 2>&1 | grep -q -- \
            '--with-http_v2_module'

          ./nginx -V 2>&1 | grep -q -- \
            '--with-http_v3_module'

          echo "OK: required modules enabled"

      - name: Upload nginx
        uses: actions/upload-artifact@v4
        with:
          name: nginx
          path: nginx
          if-no-files-found: error
          compression-level: 0
